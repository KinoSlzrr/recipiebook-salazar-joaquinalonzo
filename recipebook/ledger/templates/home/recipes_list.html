{% extends 'base.html' %}

{% block title %}Recipes List{% endblock %}

{% block content %}
    <ul>
        {% for recipe in object_list %}
            <li>
                <a href="{{recipe.get_absolute_url}}">{{recipe.name}}</a>
            </li>
        {% endfor %}
        <br>
        <a href="{% url 'ledger:recipe-add' %}">Add a new recipe</a>
    </ul>
{% endblock %}
